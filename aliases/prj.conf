# Seri Port ve Kesme Desteği
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# I2C Desteği (LCD için)
CONFIG_I2C=y

# Networking ve Wi-Fi
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_SOCKETS=y

# ESP-AT Modem Sürücüsü
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y

# IP Yapılandırması (IPv4 / DHCP)
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MAX_CONTEXTS=10

# Rastgele Sayı Üreteci
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Log Çıktıları
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_WIFI_LOG_LEVEL_INF=y